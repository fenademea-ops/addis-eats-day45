<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 19 Exercises - CodeOps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Exercise 1: Title Change & Class Toggle -->
  <section>
    <h1 id="main-title">Original Title</h1>
    <button id="toggle-btn">Toggle Title Style</button>
  </section>

  <!-- Exercise 2: Ethiopian Cities List -->
  <section>
    <h2>Ethiopian Cities</h2>
    <ul id="city-list"></ul>
  </section>

  <!-- Exercise 3: Event Bubbling Demo -->
  <section>
    <h2>Bubbling Demo</h2>
    <div id="parent-div">
      Parent Div
      <button id="child-btn">Click Me (Bubbling)</button>
    </div>
  </section>

  <!-- Exercise 4: Event Delegation (Delete Items) -->
  <section>
    <h2>Event Delegation (Delete Items)</h2>
    <ul id="item-list">
      <li>Item 1 <button class="delete-btn">Delete</button></li>
      <li>Item 2 <button class="delete-btn">Delete</button></li>
      <li>Item 3 <button class="delete-btn">Delete</button></li>
    </ul>
  </section>

  <!-- Exercise 5: Form Submission -->
  <section>
    <h2>Form Submission</h2>
    <form id="todo-form">
      <input type="text" id="item-input" placeholder="Enter item name" required>
      <button type="submit">Add Item</button>
    </form>
    <ul id="todo-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
