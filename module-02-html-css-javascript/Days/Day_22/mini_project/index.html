<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birr Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-card">
    <header class="app-header">
      <h2>Birr Watch 🇪🇹</h2>
      <div id="status" class="status-line loading" aria-live="polite">Initializing...</div>
    </header>

    <!-- Currency Converter Section -->
    <section class="section">
      <h3>Currency Converter</h3>
      <form id="convert-form" novalidate>
        <div class="form-group">
          <label for="amount">Amount (ETB):</label>
          <input 
            type="number" 
            id="amount" 
            placeholder="e.g. 100" 
            min="0.01" 
            step="any"
          >
        </div>

        <div class="form-group">
          <label for="currency">Target Currency:</label>
          <select id="currency" disabled>
            <option value="">-- Select Currency --</option>
          </select>
        </div>

        <button type="submit" id="convert-btn" disabled>Convert</button>
      </form>

      <!-- Conversion Result Box -->
      <div id="result" class="result-box hidden" aria-live="polite"></div>
    </section>

    <!-- Watchlist Section -->
    <section class="section">
      <div class="watchlist-header">
        <h3>Currency Watchlist</h3>
        <button type="button" id="add-watchlist-btn" class="btn-secondary" disabled>
          + Track Currency
        </button>
      </div>

      <ul id="watchlist-ul" class="watchlist-list">
        <!-- Watchlist items render dynamically from state -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
