<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 3 - Photo Gallery</title>
  <link rel="stylesheet" href="exercise_03.css" />
</head>
<body>

  <main class="gallery-container">
    <h2 class="title">Habesha Dish Gallery</h2>

    <!-- STEP 3: Grid Photo Gallery -->
    <section class="gallery">
      
      <div class="photo-card">
        <img src="asset/doro_wat.jpg" alt="Doro Wat" />
        <div class="caption">Doro Wat</div>
      </div>

      <div class="photo-card">
        <img src="asset/veggie-combo.jpg" alt="Veggie Combo" />
        <div class="caption">Veggie Combo</div>
      </div>

      <div class="photo-card">
        <img src="asset/injera.jpg" alt="Injera" />
        <div class="caption">Injera</div>
      </div>

      <div class="photo-card">
        <img src="asset/firfir.jpg" alt="Firfir" />
        <div class="caption">Firfir</div>
      </div>

    </section>
  </main>

</body>
</html>
