<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feneti Specialty Coffee — Bole, Addis Ababa</title>
  
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <article class="profile-card">
      <!-- Card Image & Visible Caption -->
      <figure class="profile-card__image-container">
        <img src="../assets/coffee.jpg" alt="Feneti Specialty Coffee Cup" class="profile-card__img">
        <figcaption class="profile-card__caption">Feneti Specialty Coffee Cup</figcaption>
      </figure>

      <header class="profile-card__header">
        <h1 class="profile-card__title">Feneti Specialty Coffee</h1>
        <p class="profile-card__tagline">AUTHENTIC ETHIOPIAN ROAST &amp; PASTRIES</p>
      </header>

      <div class="profile-card__content">
        <p class="profile-card__text">
          Located in the heart of Bole, Addis Ababa. We serve single-origin Yirgacheffe roasts, traditional bunna, and fresh snacks in a cozy, modern space.
        </p>
        <span class="profile-card__badge">TeleBirr Accepted</span>
      </div>

      <footer class="profile-card__footer">
        <a href="tel:+251911234567" class="contact-btn">Contact Us</a>
      </footer>
    </article>
  </main>

</body>
</html>
