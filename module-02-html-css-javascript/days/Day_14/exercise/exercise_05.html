<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 5 - ETB Sale Badge</title>
  <link rel="stylesheet" href="exercise_05.css" />
</head>
<body>

  <div class="card-container">

    <!-- EXERCISE 5: Product card with pinned relative + absolute badge -->
    <article class="product-card">

      <!-- Absolute Circular Badge -->
      <div class="sale-badge">
        ETB<br>Sale
      </div>

      <!-- Card Image -->
      <div class="card-img">
        <img src="asset/doro_wat.jpg" alt="Doro Wat" />
      </div>

      <!-- Card Content -->
      <div class="card-content">
        <h3 class="card-title">Doro Wat</h3>
        <p class="card-description">
          Slow-cooked chicken stew in rich berbere spice with hard-boiled eggs.
        </p>
        <div class="card-price">
        
          <span class="new-price">350 ETB</span>
        </div>
      </div>

    </article>

  </div>

</body>
</html>
