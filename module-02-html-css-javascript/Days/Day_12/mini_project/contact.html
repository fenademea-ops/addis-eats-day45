<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Habesha Eatery, Bole</title>
    <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa and check our opening hours.">
</head>
<body>

    <header>
        <h1>Contact Habesha Eatery</h1>
        <nav aria-label="Main Navigation">
            <a href="index.html">Reservations &amp; Menu</a> · 
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Section 1: Contact Form -->
        <section>
            <h2>Send Us a Message</h2>
            <form action="/contact" method="post">
                <p>
                    <label for="contact-name">Name:</label><br>
                    <input id="contact-name" name="name" type="text" placeholder="Your Name" required>
                </p>

                <p>
                    <label for="contact-email">Email Address:</label><br>
                    <input id="contact-email" name="email" type="email" placeholder="name@example.com" required>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your inquiry here..." required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                </p>
            </form>
        </section>

        <hr>

        <!-- Section 2: Opening Hours Table -->
        <section>
            <h2>Opening Hours</h2>
            <table border="1" cellpadding="8" style="border-collapse: collapse;">
                <caption>Weekly Service Schedule for Habesha Eatery</caption>
                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Opening Hours</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Monday – Thursday</td>
                        <td>08:00 AM – 10:00 PM</td>
                    </tr>
                    <tr>
                        <td>Friday – Saturday</td>
                        <td>08:00 AM – 11:00 PM</td>
                    </tr>
                    <tr>
                        <td>Sunday</td>
                        <td>09:00 AM – 09:30 PM</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Bole, Addis Ababa, Ethiopia</p>
    </footer>

</body>
</html>
