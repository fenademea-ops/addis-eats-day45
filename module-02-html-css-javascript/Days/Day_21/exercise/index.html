<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Signup Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="header-bar">
      <h2>Create Account</h2>
      <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme">
        <span class="theme-icon">🌙</span> Dark Mode
      </button>
    </div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="off">
          <span class="error-icon" aria-hidden="true">⚠️</span>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <input type="text" id="phone" name="phone" placeholder="0912345678 or +251912345678" autocomplete="off">
          <span class="error-icon" aria-hidden="true">⚠️</span>
        </div>
      </div>

      <div id="error-area" aria-live="polite"></div>

      <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <div id="stats" class="stats-box">
      <span class="stats-count">0</span>
      <span class="stats-label">Total Registered Signups</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
