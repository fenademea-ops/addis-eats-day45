<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Addis Eats</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  
</head>
<body>

  <div class="login-wrapper">
    <div class="login-box">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 54px; height: 54px; background: var(--admin-primary); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 0.75rem auto;">
          🍲
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem;">Addis Eats Admin</h1>
        <p style="font-size: 0.85rem; color: var(--admin-text-muted);">Restaurant Management & Live Kitchen Portal</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label" for="adminUser">Username</label>
          <input type="text" id="adminUser" class="form-input" placeholder="admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPass">Password</label>
          <input type="password" id="adminPass" class="form-input" placeholder="admin123" required autocomplete="current-password">
        </div>

        <div id="loginError" class="form-error" style="margin-bottom: 1rem;">
          Invalid credentials. Use <strong>admin</strong> / <strong>admin123</strong>.
        </div>

        <button type="submit" class="btn-checkout" style="width: 100%; margin-top: 0.5rem;">
          Sign In to Dashboard
        </button>

        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="index.html" style="font-size: 0.85rem; color: var(--admin-text-muted); text-decoration: none;">
            ← Return to Customer Storefront
          </a>
        </div>
      </form>

      
    </div>
  </div>

  <script src="admin-login.js"></script>
</body>
</html>
