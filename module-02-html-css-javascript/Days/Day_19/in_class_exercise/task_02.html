<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 2: DOM Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .toolbar button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-add { background: #28a745; color: white; }
        .btn-add:hover { background: #218838; }
        .btn-toggle { background: #ffc107; color: #212529; }
        .btn-toggle:hover { background: #e0a800; }
        .btn-remove { background: #dc3545; color: white; }
        .btn-remove:hover { background: #c82333; }
        .btn-clear { background: #6c757d; color: white; }
        .btn-clear:hover { background: #5a6268; }
        
        .item {
            padding: 12px 16px;
            margin: 6px 0;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #6c5ce7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .item.done {
            border-left-color: #28a745;
            background: #d4edda;
            text-decoration: line-through;
            opacity: 0.7;
        }
        .item .delete-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .item .delete-btn:hover {
            background: #e17055;
        }
        #counter {
            margin-top: 20px;
            padding: 10px;
            background: #dfe6e9;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        .empty-state {
            text-align: center;
            color: #b2bec3;
            padding: 30px;
        }
    </style>
</head>
<body>
    <h1>📝 Task Manager</h1>
    
    <div class="toolbar">
        <button class="btn-add" id="addBtn">➕ Add Task</button>
        <button class="btn-toggle" id="toggleBtn">🔄 Toggle First</button>
        <button class="btn-remove" id="removeBtn">🗑️ Remove Last</button>
        <button class="btn-clear" id="clearBtn">🧹 Clear All</button>
    </div>
    
    <div id="task-list"></div>
    
    <div id="counter">Total Tasks: 0</div>

    <script>
        let tasks = [
            { id: 1, text: "Buy Teff", done: false },
            { id: 2, text: "Buy Berbere", done: false },
            { id: 3, text: "Buy Shiro", done: false }
        ];
        let nextId = 4;

        const taskList = document.querySelector("#task-list");
        const counter = document.querySelector("#counter");

        function render() {
            taskList.innerHTML = "";

            if (tasks.length === 0) {
                const emptyMsg = document.createElement("div");
                emptyMsg.className = "empty-state";
                emptyMsg.textContent = "No tasks yet! Click 'Add Task' to get started.";
                taskList.appendChild(emptyMsg);
            } else {
                tasks.forEach(task => {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = `item ${task.done ? "done" : ""}`;

                    const textSpan = document.createElement("span");
                    textSpan.textContent = task.text;
                    textSpan.style.cursor = "pointer";
                    textSpan.addEventListener("click", () => toggleTask(task.id));

                    const deleteBtn = document.createElement("button");
                    deleteBtn.className = "delete-btn";
                    deleteBtn.textContent = "✖ Delete";
                    deleteBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        removeTask(task.id);
                    });

                    itemDiv.appendChild(textSpan);
                    itemDiv.appendChild(deleteBtn);
                    taskList.appendChild(itemDiv);
                });
            }

            counter.textContent = `Total Tasks: ${tasks.length}`;
        }

        function addTask(text) {
            tasks.push({
                id: nextId++,
                text: text,
                done: false
            });
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                render();
            }
        }

        function removeTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            render();
        }

        function clearAll() {
            tasks = [];
            render();
        }

        document.querySelector("#addBtn").addEventListener("click", function() {
            const text = prompt("Enter task name:");
            if (text && text.trim()) {
                addTask(text.trim());
            }
        });

        document.querySelector("#toggleBtn").addEventListener("click", function() {
            if (tasks.length > 0) {
                toggleTask(tasks[0].id);
            } else {
                alert("No tasks to toggle!");
            }
        });

        document.querySelector("#removeBtn").addEventListener("click", function() {
            if (tasks.length > 0) {
                const lastTask = tasks[tasks.length - 1];
                removeTask(lastTask.id);
            } else {
                alert("No tasks to remove!");
            }
        });

        document.querySelector("#clearBtn").addEventListener("click", function() {
            if (tasks.length > 0 && confirm("Delete all tasks?")) {
                clearAll();
            }
        });

        render();
        console.log("📝 Task Manager ready!");
    </script>
</body>
</html>
